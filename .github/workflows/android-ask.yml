name: LEMEET Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm install
      - name: Create Android project
        run: npx cap add android
      - name: Sync Android
        run: npx cap sync android
      - name: Register Google login return link
        run: |
          python3 - <<'PY'
          from pathlib import Path
          manifest = Path('android/app/src/main/AndroidManifest.xml')
          xml = manifest.read_text(encoding='utf-8')
          scheme = 'com.lemeet.app'
          if f'android:scheme="{scheme}"' not in xml:
              intent = '''
                  <intent-filter>
                      <action android:name="android.intent.action.VIEW" />
                      <category android:name="android.intent.category.DEFAULT" />
                      <category android:name="android.intent.category.BROWSABLE" />
                      <data android:scheme="com.lemeet.app"
                            android:host="auth"
                            android:path="/callback" />
                  </intent-filter>
              '''
              if '</activity>' not in xml:
                  raise RuntimeError('Android main activity not found')
              xml = xml.replace('</activity>', intent + '\n        </activity>', 1)
              manifest.write_text(xml, encoding='utf-8')
          PY
      - name: Generate LEMEET Android launcher icons
        run: |
          python3 -m pip install --user Pillow
          python3 - <<'PYICON'
          from pathlib import Path
          from PIL import Image, ImageOps, ImageDraw, ImageChops

          source = Path('www/lemeet-icon.png')
          if not source.is_file():
              raise FileNotFoundError('Missing official logo: www/lemeet-icon.png')
          logo = Image.open(source).convert('RGBA')
          res = Path('android/app/src/main/res')
          densities = {'mdpi': 48, 'hdpi': 72, 'xhdpi': 96,
                       'xxhdpi': 144, 'xxxhdpi': 192}

          for density, size in densities.items():
              folder = res / f'mipmap-{density}'
              folder.mkdir(parents=True, exist_ok=True)
              square = ImageOps.fit(logo, (size, size), method=Image.Resampling.LANCZOS)
              square.save(folder / 'ic_launcher.png')
              circle_mask = Image.new('L', (size, size), 0)
              ImageDraw.Draw(circle_mask).ellipse((0, 0, size - 1, size - 1), fill=255)
              round_icon = square.copy()
              round_icon.putalpha(ImageChops.multiply(round_icon.getchannel('A'), circle_mask))
              round_icon.save(folder / 'ic_launcher_round.png')

              # Adaptive icon foreground: keep the logo inside Android's safe zone.
              fg_size = round(size * 2.25)
              art_size = round(fg_size * 0.64)
              art = ImageOps.contain(logo, (art_size, art_size), method=Image.Resampling.LANCZOS)
              foreground = Image.new('RGBA', (fg_size, fg_size), (0, 0, 0, 0))
              foreground.alpha_composite(art, ((fg_size - art.width) // 2,
                                               (fg_size - art.height) // 2))
              foreground.save(folder / 'ic_launcher_foreground.png')

          # Capacitor's adaptive icon XML normally references @mipmap/ic_launcher_foreground.
          print('LEMEET launcher icons generated from', source)
          PYICON
      - name: Build APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug
      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: LEMEET-Android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
